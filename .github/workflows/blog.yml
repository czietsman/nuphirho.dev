name: Deploy Blog to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'blog/**'
  pull_request:
    paths:
      - 'posts/**'
      - 'blog/**'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: blog-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: blog

      - name: Test
        run: npm test
        working-directory: blog

      - name: Build
        run: npm run build
        working-directory: blog

      - name: Deploy to Cloudflare Pages
        if: github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .svelte-kit/cloudflare --project-name=nuphirho-blog${{ github.event_name == 'pull_request' && format(' --branch={0}', github.head_ref) || '' }}
          workingDirectory: blog

      - name: Set up Go for notifications
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build notification tool
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: go build -o notify ./cmd/notify/

      - name: Send deployment notification
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./notify "Blog deployment ${DEPLOY_STATUS}: ${RUN_URL}"
