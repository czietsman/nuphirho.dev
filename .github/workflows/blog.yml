name: Deploy Blog to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'blog/**'
  pull_request:
    paths:
      - 'posts/**'
      - 'blog/**'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: blog-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: blog

      - name: Build
        run: npm run build
        working-directory: blog

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .svelte-kit/cloudflare --project-name=nuphirho-blog${{ github.event_name == 'pull_request' && format(' --branch={0}', github.head_ref) || '' }}
          workingDirectory: blog

      - name: Set up Go for notifications
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build notification tool
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: go build -o notify ./cmd/notify/

      - name: Send deployment notification
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./notify "Blog deployment ${DEPLOY_STATUS}: ${RUN_URL}"
