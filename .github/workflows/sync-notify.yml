name: Notify on sync branch

on:
  create:

permissions: {}

concurrency:
  group: sync-notify
  cancel-in-progress: true

jobs:
  notify:
    name: Send Telegram notification
    if: startsWith(github.ref, 'refs/heads/sync/') && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build notification tool
        run: go build -o notify ./cmd/notify/

      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          BRANCH_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}?expand=1
        run: |
          ./notify "New sync branch: ${BRANCH} — ${BRANCH_URL} — Create PR: ${PR_URL}"
